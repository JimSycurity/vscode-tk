name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tag pushes can point at feature commits; publish only commits on main.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
          package_version="$(node -p 'require("./package.json").version')"
          lock_version="$(node -p 'require("./package-lock.json").version')"
          lock_root_version="$(node -p 'require("./package-lock.json").packages[""].version')"
          if [ "$RELEASE_TAG" != "v$package_version" ] || [ "$package_version" != "$lock_version" ] || [ "$package_version" != "$lock_root_version" ]; then
            echo "::error::Release tag, package.json, and package-lock.json versions must match."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify VSIX package contents
        run: npm run package:dry-run

      - name: Build VSIX
        run: npm run package:vsix

      - name: Generate checksums
        run: sha256sum *.vsix > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-tk-vsix
          path: |
            *.vsix
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix SHA256SUMS.txt --generate-notes --verify-tag
